# 本地构建与验证用的 cfbypass 编排片段（127.0.0.1 边界）。
# 生产编排仍以仓库根目录 docker-compose.yml 中的 cfbypass 服务为准，环境变量保持一致。
services:
  cfbypass:
    build: .
    image: chatgpt-mirror-cfbypass:local
    command:
      - uvicorn
      - app:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    ports:
      - "127.0.0.1:18001:8000"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      CF_BYPASS_USER_AGENT: "${CF_BYPASS_USER_AGENT:-Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 Safari/537.36}"
      CF_BYPASS_ACCEPT_LANGUAGE: "${CF_BYPASS_ACCEPT_LANGUAGE:-zh-CN,zh}"
      CF_BYPASS_HEADLESS: "${CF_BYPASS_HEADLESS:-true}"
      CF_BYPASS_MAX_WAIT_SECONDS: "${CF_BYPASS_MAX_WAIT_SECONDS:-20}"
      CF_BYPASS_PAGE_LOAD_TIMEOUT_SECONDS: "${CF_BYPASS_PAGE_LOAD_TIMEOUT_SECONDS:-15}"
      CF_BYPASS_FIRST_COOKIE_WAIT_SECONDS: "${CF_BYPASS_FIRST_COOKIE_WAIT_SECONDS:-6}"
      CF_BYPASS_POLL_INTERVAL_SECONDS: "${CF_BYPASS_POLL_INTERVAL_SECONDS:-0.5}"
      CF_BYPASS_COOKIE_STABLE_POLLS: "${CF_BYPASS_COOKIE_STABLE_POLLS:-2}"
      CF_BYPASS_NAVIGATION_RETRIES: "${CF_BYPASS_NAVIGATION_RETRIES:-1}"
      CF_BYPASS_ELEMENT_LOOKUP_TIMEOUT_SECONDS: "${CF_BYPASS_ELEMENT_LOOKUP_TIMEOUT_SECONDS:-0.2}"
      CF_BYPASS_DISPLAY_SIZE: "${CF_BYPASS_DISPLAY_SIZE:-1920x1080}"
      CF_BYPASS_SECRET: "${CF_BYPASS_SECRET:?CF_BYPASS_SECRET must be set}"
      CF_BYPASS_ALLOWED_HOSTS: "${CF_BYPASS_ALLOWED_HOSTS:-127.0.0.1,localhost}"
      CF_BYPASS_PROXY_SERVER: "${CF_BYPASS_PROXY_SERVER:-}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    shm_size: "1gb"

# 候选（Rust）网关的管理界面入口：只服务 Vue 管理端，并把 /0x/ 管理 API 转给网关。
#
# 为什么单独一个端口、而不是像原版那样由网关自己托管：原版网关用 tower-http ServeDir
# 直接在 /admin、/static 上吐前端产物（reverse/reports/08-reconstruction-notes.md §3.3、
# §7 路由表），候选网关把 /admin 透传给 Django（管理 API 后端，生产模式没有该路由），
# 所以管理界面由这个 nginx 侧车提供。镜像面（/、/backend-api/*、/ws-chatgpt 等）
# 仍直连网关端口，不经过这里：SSE 与 WebSocket 少一跳，代理链路语义不变。
server {
    listen 80;
    server_name _;

    # 相对跳转：宿主端口是 ${ADMIN_PORT}（默认 40003），nginx 的绝对跳转只会写
    # listen 端口（80），会跳到一个不存在的地址。
    absolute_redirect off;

    location = / {
        return 302 /admin/;
    }

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location /0x/ {
        # 用变量 + Docker 内嵌 DNS 让 nginx 按 TTL 重新解析：静态写 `proxy_pass
        # http://gateway:40002` 时 nginx 只在启动时解析一次并永久缓存，网关容器一旦重建
        # （换 IP）管理端就整片 502（2026-09-28 实测：nginx 仍指向 172.19.0.2，网关已是
        # 172.19.0.5）。valid=10s 是重新解析间隔，ipv6=off 避免解析出容器网络外的地址。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway_upstream gateway;
        # 容器网络内固定 40002：compose 里网关的容器端口是常量，只有宿主端口可配。
        # 变量形式下不写 URI，请求原始 URI 原样透传（与静态写法等价）。
        proxy_pass http://$gateway_upstream:40002;
        proxy_http_version 1.1;
        # 必须用 $http_host（带端口）：Django 的 CSRF Origin 校验拿 Host 与 Origin 比对，
        # 用 $host 会丢掉端口，管理端在 40003 上发起的 POST 会被判 CSRF 403。
        proxy_set_header Host $http_host;
        # X-Forwarded-Proto 刻意不在这里改写：外层 TLS 终结器设置的同名头原样透传，
        # Django 的 SECURE_PROXY_SSL_HEADER 依赖它判定请求是否安全。
    }
}

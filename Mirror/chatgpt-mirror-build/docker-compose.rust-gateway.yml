# 候选（Rust）网关的部署编排：gateway + django + cfbypass + frontend（管理界面）。
#
# 与 docker-compose.yml（拉上游预构建镜像）和 docker-compose.route-a.yml（构建 Python 网关）
# 都不同：这里的 gateway 从 Mirror/gateway-rust/artifacts/phase1/source 的 Dockerfile
# 源码构建，产物是 wreq/btls 的 Rust 实现。
#
# 用法（在 Mirror/chatgpt-mirror-build/ 下）：
#   docker compose --env-file .env -f docker-compose.rust-gateway.yml up -d --build
#
# 与旧部署的关系：gateway 用独立数据库（/app/data/gateway-rust.db，容器内卷），
# 不复用旧网关的库；Django 的用户/账号数据沿用 backend/db 卷。
#
# 端口约定：
#   ${PORT:-40002}        镜像入口（网关本体，直连）：/、/backend-api/*、/ws-chatgpt 等
#   ${ADMIN_PORT:-40003}  管理界面（nginx 侧车）：/admin/ 静态页 + /0x/ 管理 API
# 网关的容器端口固定 40002：只有宿主端口可配，避免侧车与 Django 的固定指向漂移。
services:
  gateway:
    build:
      context: ../gateway-rust/artifacts/phase1/source
      dockerfile: Dockerfile
    image: mirror-gateway:phase1
    ports:
      - "${PORT:-40002}:40002"
    volumes:
      - gateway-data:/app/data
    environment:
      HOST: "0.0.0.0"
      PORT: "40002"
      TZ: "${TZ:-Asia/Shanghai}"
      # 默认是 offline（只允许数字回环上游）；对真实 chatgpt.com 必须显式 configured。
      GATEWAY_UPSTREAM_MODE: "configured"
      GATEWAY_COMPAT_PROFILE: "mirror"
      DATABASE_PATH: "/app/data/gateway-rust.db"
      GATEWAY_ADMIN_SECRET: "${GATEWAY_ADMIN_SECRET:?GATEWAY_ADMIN_SECRET must be set}"
      CREDENTIAL_ENCRYPTION_KEY: "${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY must be set}"
      DJANGO_UPSTREAM: "http://django:8000"
      CHATGPT_BASE_URL: "${CHATGPT_BASE_URL:-https://chatgpt.com}"
      CHATGPT_CDN_BASE_URL: "${CHATGPT_CDN_BASE_URL:-https://cdn.oaistatic.com}"
      CHATGPT_AB_BASE_URL: "${CHATGPT_AB_BASE_URL:-https://ab.chatgpt.com}"
      CF_BYPASS_URL: "http://cfbypass:8000"
      REQUEST_TIMEOUT_SECS: "${REQUEST_TIMEOUT_SECS:-180}"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      RUST_LOG: "${RUST_LOG:-info}"
      NO_PROXY: "localhost,127.0.0.1,django,gateway,cfbypass"
      no_proxy: "localhost,127.0.0.1,django,gateway,cfbypass"
    depends_on:
      django:
        condition: service_healthy
      cfbypass:
        condition: service_started
    restart: unless-stopped
    networks:
      - chatgpt-network

  django:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: mirror-django:phase1
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - ./backend/db:/app/backend/db
      - ./backend/logs:/app/backend/logs
    environment:
      DJANGO_ENV: "PRODUCTION"
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-django,localhost,127.0.0.1}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-}"
      DJANGO_SECURE_SSL_REDIRECT: "${DJANGO_SECURE_SSL_REDIRECT:-false}"
      DJANGO_SESSION_COOKIE_SECURE: "${DJANGO_SESSION_COOKIE_SECURE:-true}"
      DJANGO_CSRF_COOKIE_SECURE: "${DJANGO_CSRF_COOKIE_SECURE:-true}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}"
      GATEWAY_ADMIN_SECRET: "${GATEWAY_ADMIN_SECRET:?GATEWAY_ADMIN_SECRET must be set}"
      CREDENTIAL_ENCRYPTION_KEY: "${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY must be set}"
      ALLOW_REGISTER: "${ALLOW_REGISTER:-false}"
      FREE_ACCOUNT_USERNAME: "${FREE_ACCOUNT_USERNAME:-free_account}"
      CHATGPT_GATEWAY_URL: "http://gateway:40002"
      LOCAL_NETWORK_ACCESS: "${LOCAL_NETWORK_ACCESS:-disable}"
      NO_PROXY: "localhost,127.0.0.1,django,gateway,cfbypass"
      no_proxy: "localhost,127.0.0.1,django,gateway,cfbypass"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/0x/user/version-cfg', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks:
      - chatgpt-network

  cfbypass:
    build:
      context: .
      dockerfile: cfbypass/Dockerfile
    image: mirror-cfbypass:phase1
    ports:
      - "127.0.0.1:18001:8000"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      # 必须与网关身份常量逐字符相同（见 cfbypass/README「身份一致性」）。
      CF_BYPASS_USER_AGENT: "${CF_BYPASS_USER_AGENT:-Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 Safari/537.36}"
      CF_BYPASS_ACCEPT_LANGUAGE: "${CF_BYPASS_ACCEPT_LANGUAGE:-zh-CN,zh}"
      CF_BYPASS_HEADLESS: "${CF_BYPASS_HEADLESS:-true}"
      CF_BYPASS_SECRET: "${GATEWAY_ADMIN_SECRET:?GATEWAY_ADMIN_SECRET must be set}"
      CF_BYPASS_ALLOWED_HOSTS: "${CF_BYPASS_ALLOWED_HOSTS:-chatgpt.com,.chatgpt.com}"
    shm_size: "1gb"
    restart: unless-stopped
    networks:
      - chatgpt-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: mirror-frontend:phase1
    ports:
      - "${ADMIN_PORT:-40003}:80"
    volumes:
      # 镜像内置的 nginx.conf 面向 route-a（网关在 8000）；候选网关的容器端口是 40002，
      # 且入站 Host 必须保留端口（Django CSRF Origin 校验），因此覆盖成专用配置。
      - ./frontend/nginx.rust.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped
    networks:
      - chatgpt-network

volumes:
  gateway-data:

networks:
  chatgpt-network:
    driver: bridge

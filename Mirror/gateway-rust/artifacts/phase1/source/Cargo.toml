[package]
name = "mirror-gateway"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
axum = { version = "0.7.9", features = ["ws", "macros"] }
base64 = "0.22"
brotli = "8"
bytes = "1"
flate2 = "1.1"
futures-util = "0.3"
http-body = "1"
http-body-util = "0.1"
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
wreq = { version = "=6.0.0-rc.31", default-features = false, features = ["webpki-roots", "tokio-rt", "json", "stream", "socks", "ws"] }
wreq-util = "=3.0.0-rc.14"
zstd = "0.13"

[dev-dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream", "socks"] }
tempfile = "3"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

[profile.release]
strip = false
lto = "thin"

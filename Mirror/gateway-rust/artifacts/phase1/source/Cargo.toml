[package]
name = "mirror-gateway"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
axum = { version = "0.7.9", features = ["ws", "macros"] }
base64 = "0.22"
bytes = "1"
flate2 = "1.1"
futures-util = "0.3"
http-body = "1"
http-body-util = "0.1"
rand = "0.8"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream", "socks"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = false
lto = "thin"
